openapi: 3.2.0
info:
  title: Amazon Transcribe Transcription Jobs Vocabularies API
  description: Amazon Transcribe is an automatic speech recognition (ASR) service that makes it easy to add speech-to-text capability to applications. The API supports batch transcription jobs, real-time streaming transcription, custom vocabularies, and vocabulary filters.
  version: '2017-10-26'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/transcribe/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  termsOfService: https://aws.amazon.com/service-terms/
  x-logo:
    url: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
servers:
- url: https://transcribe.{region}.amazonaws.com
  description: Amazon Transcribe regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-central-1
      - ap-northeast-1
      - ap-southeast-1
      - ap-southeast-2
      - ap-south-1
      - ca-central-1
security:
- aws_sig_v4: []
tags:
- name: Vocabularies
paths:
  /#CreateVocabulary:
    post:
      operationId: CreateVocabulary
      summary: Amazon Transcribe Create a Custom Vocabulary
      description: Creates a new custom vocabulary for improving transcription accuracy.
      tags:
      - Vocabularies
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: object
              required:
              - VocabularyName
              - LanguageCode
              properties:
                VocabularyName:
                  type: string
                LanguageCode:
                  type: string
                Phrases:
                  type: array
                  items:
                    type: string
                VocabularyFileUri:
                  type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  VocabularyName:
                    type: string
                  VocabularyState:
                    type: string
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    aws_sig_v4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication.
externalDocs:
  description: Amazon Transcribe API Reference
  url: https://docs.aws.amazon.com/transcribe/latest/APIReference/Welcome.html
